# A0 gate 8 — per-OS toolchain matrix. Gates needing the D0 archive (W1 replay)
# and the Docker-backed clean install run on the prod box only (tier A); CI keeps
# cargo + python + SQL-idempotence + the cross-OS install contract (A2 A-6).
#
# Job ids are prefixed with the OS family on purpose: `python/gates/status.py`
# reads `gh run view --json jobs` and proves the newest release run went green on
# ≥2 families. Renaming a job without the prefix breaks that assertion, loudly.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu-rust:
    strategy:
      matrix:
        os: [ubuntu-latest]  # tier A
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: fmt
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --all --all-features

  ubuntu-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: train lane
        working-directory: python/train
        run: uv run pytest -q
      - name: collect lane
        working-directory: python/train
        run: uv run pytest -q ../collect/test_nse_fo_bhavcopy.py ../collect/test_register_b1_metadata.py
      - name: collect lane (full suite, own env)
        working-directory: python/collect
        run: uv run pytest -q
      - name: collect lint
        run: uvx ruff check python/collect/ --output-format concise
      - name: gates lane (aggregator self-tests + lint)
        # status.py decides whether every other gate is green, so it is tested here.
        # Only the files this lane owns are linted: w0b_gates.py carries 22
        # pre-existing ruff findings (subprocess without check=, SIM115) that predate
        # this lane and are not silently swept in by it.
        run: |
          (cd python/train && uv run pytest -q ../gates/test_status.py)
          uvx ruff check python/gates/status.py python/gates/test_status.py python/gates/tier_gates.py --output-format concise
      - name: cross-OS install contract (A-6)
        # POSIX parses under dash on this runner and the bare-PATH run proves the
        # installer names every missing tool at once; CIOS proves the workflow
        # still declares all three families.
        run: python3 python/gates/tier_gates.py POSIX CIOS PS1 PROBE ENCODING

  ubuntu-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gfti
          POSTGRES_USER: gfti_app
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: apply 001-006 twice (idempotent migrations must not error)
        run: |
          for i in 1 2; do
            for f in compose/sql/001_d3_d4_init.sql compose/sql/002_w0b_approval_flow.sql \
                     compose/sql/003_b1_data_plane.sql compose/sql/004_w0c_llm_tasks.sql \
                     compose/sql/005_w1_artifacts.sql compose/sql/006_d3_intraday_metadata.sql; do
              docker run --rm -v "$PWD/compose/sql:/sql:ro" \
                --network host \
                -e PGPASSWORD=ci-local-only postgres:17 \
                psql -h 127.0.0.1 -U gfti_app -d gfti -v ON_ERROR_STOP=1 -f "/sql/$(basename $f)" || exit 1
            done
          done

  # Tier B — macOS. GitHub's hosted macOS runners have no Docker daemon, so this
  # job proves the half that does not need one: the Rust engines build and pass
  # their unit tests, the python lanes run, the tier probe reports B, and the
  # installer is POSIX sh. The Docker-backed clean-install-twice for tier B is an
  # owner action on a macOS host with Docker Desktop (docs/install-tiers.md), and
  # this job does not claim it.
  macos-tier-b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: engine unit tests (no latency gates — those are tier A)
        working-directory: rust
        run: cargo test --all --all-features
      - name: python lanes
        working-directory: python/train
        run: uv run pytest -q
      - name: tier probe is B and the installer is POSIX on macOS /bin/sh
        run: python3 python/gates/tier_gates.py PROBE POSIX PS1 ENCODING

  # Tier C — Windows. Native Windows is supported for the CLI only; services run
  # under WSL2 (docs/install-tiers.md). So this job exercises exactly the paths a
  # native Windows user has: the PowerShell shim, the CLI's config/tier/workflows
  # verbs, and the refusal that points at WSL2. No docker call may appear here.
  windows-tier-c:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tier is C and the PowerShell shim matches the CLI
        run: python python/gates/tier_gates.py PROBE PS1 ENCODING
      - name: CLI non-Docker verbs
        run: |
          python python/gfti/cli.py tier --json
          python python/gfti/cli.py config --json > $null
          python python/gfti/cli.py workflows --json > $null
          python python/gfti/cli.py --help > $null
      # The native-install refusal (exit 2 + the WSL2 route) is asserted by
      # `tier_gates.py PROBE`, whose Windows branch exists for exactly this. An
      # ad-hoc `if ($LASTEXITCODE -ne 2)` here measured the pwsh wrapper, not the
      # CLI, and failed while the CLI behaved correctly.
