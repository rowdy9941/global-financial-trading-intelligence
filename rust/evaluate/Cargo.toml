[package]
name = "evaluate"
version = "0.1.0"
edition.workspace = true

# E2 evaluator input side (A0 baseline §3, engine §lib): load ONLY a
# D5-signed artifact; refuse tampered/unsigned files. The W1 ARTIFACT gate
# (docs/gates: W1-GATE-ARTIFACT green 2026-11-03) fixed the D5 JSON shape and
# the canonical-row scheme, so the gate forced these deps (workspace policy
# comment rule): license checks done via crates.io, not-yanked:
#   serde_json 1.x   MIT OR Apache-2.0
#   sha2 0.11.1      MIT OR Apache-2.0
#   hmac 0.13.0      MIT OR Apache-2.0
#   hex  0.4.3       MIT OR Apache-2.0
# (same signing stack as the ledger crate — one canonical-row scheme, two
# consumers, so the D5 registry + the E2 loader cannot drift apart silently).

[dependencies]
featurize = { path = "../featurize" }
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
serde_json = "1"

[dev-dependencies]

[lints.rust]
warnings = "deny"
