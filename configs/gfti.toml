# The single source of truth for everything that is NOT a secret (A2 §4 A-4).
#
# `compose/.env` holds credentials only, and the keys it may contain are declared
# here under [secrets]. Every value below has at least one consumer, and the
# consumer names are in the comments — a key nothing reads is a value nobody can
# verify, so none are included.
#
# Change a value, then `gfti config` shows the derived compose environment;
# `gfti up` hands exactly that environment to docker compose.

version = 1

[host]
# auto = detect (A0 §2). A = Linux, B = macOS, C = Windows via WSL2.
# `install.sh --tier=X` asserts instead of detecting.
tier = "auto"

[stores]
# host ports (bound to 127.0.0.1 in compose). -> compose `ports:`
postgres_port = 5432
postgres_db = "gfti"
postgres_user = "gfti_app"
questdb_http_port = 9000
questdb_ilp_port = 9009
nats_port = 4222
nats_monitor_port = 8222

# -> rail / cell / e7 `RAIL_NATS_URL` (inside the compose network)
nats_url = "nats://nats:4222"
# -> `gfti doctor` connectivity probe and the gate harnesses (from the host)
nats_url_host = "nats://127.0.0.1:4222"
# -> rail's `RAIL_D1_URL`: the D1 sink (A-9). `host:port` of the ILP-TCP socket as
#    seen from inside the compose network. The rail refuses to start if it cannot
#    connect, so a typo here is a startup failure, not a silent "published but not
#    stored". Gates drive the same binary natively and leave it unset on purpose:
#    a measurement must not write synthetic rows into the live store.
questdb_ilp_url = "questdb:9009"

[subjects]
# -> `CELL_SUBJECT` is `<market>.<runtime.cell.symbol>`
market = "market.spot"
# -> CELL_INTENT_PREFIX (cell publishes) AND E7_SUBJECT = "<intent>.>"
#    One value, two services: a publisher and its subscriber cannot drift apart.
intent = "order.spot"
# A-8 item 28 — the three namespaces the cell and E7 publish besides `order`.
# Each has exactly one publisher and one declared stream (see [d2] below); the
# stream's subject pattern is what makes "this is stored" true rather than assumed.
# -> CELL_SIGNAL_PREFIX (cell publishes its E2 signal)
signal = "signal.spot"
# -> CELL_RISK_PREFIX (cell publishes its E5 verdict)
risk = "risk.spot"
# -> E7_LEDGER_PREFIX (E7 publishes its signed fill)
ledger = "ledger"
# -> CELL_SEAT_PREFIX (cell publishes seat up/down)
seat = "seat"
# -> KILL_REFRESH_MS on cell (how often the kill ladder is re-read)
kill_refresh_ms = 250

[d2]
# JetStream stream declarations (A-8 item 27). This table is the only definition of
# what D2 retains: `gfti d2 apply` creates exactly these streams from this file, and
# `d2_gates.py` proves both directions — every declared stream exists, and the
# market namespace a live publisher writes is captured by one of them.
#
# Why `file` storage and not `memory`: a store that empties on restart cannot
# replay an incident, which is the whole reason D2 is separate from D1.
# `max_age_s` is a bound, not a promise of capacity; JetStream enforces both.
[[d2.streams]]
name = "MARKET"
subjects = ["market.>"]
max_age_s = 86400
storage = "file"
retention = "limits"

[[d2.streams]]
name = "SIGNAL"
subjects = ["signal.>"]
max_age_s = 86400
storage = "file"
retention = "limits"

[[d2.streams]]
name = "ORDER"
subjects = ["order.>"]
max_age_s = 604800
storage = "file"
retention = "limits"

[[d2.streams]]
name = "RISK"
subjects = ["risk.>"]
max_age_s = 604800
storage = "file"
retention = "limits"

[[d2.streams]]
name = "LEDGER"
subjects = ["ledger.>"]
max_age_s = 604800
storage = "file"
retention = "limits"

[[d2.streams]]
name = "SEAT"
subjects = ["seat.>"]
max_age_s = 604800
storage = "file"
retention = "limits"

# One durable consumer per engine that reads a stream. A declared durable with no
# reader is theatre, so `d2_gates.py` REPLAY consumes through these names and
# `gfti d2 status` reports the delivered/pending counters instead of "exists".
[[d2.consumers]]
stream = "MARKET"
name = "cell-market"
filter = "market.>"
max_deliver = 100000
ack_wait_s = 30

[[d2.consumers]]
stream = "ORDER"
name = "e7-order"
filter = "order.>"
max_deliver = 100000
ack_wait_s = 30

[runtime]
# -> RAIL_TICK_MS (idle poll, also the worst-case SIGTERM latency for rail)
railtick_ms = 200
# -> HEARTBEAT_MS for all three services
heartbeat_ms = 1000

[runtime.cell]
# 0 = run forever (A-1). Anything else keeps the bounded gate semantics.
ticks = 0
symbol = "NIFTY"
decide_every = 50
max_qty = 10

[runtime.e7]
# 0 = run forever (A-1).
expect = 0
# a resident ledger cell refuses and continues; exiting non-zero is the W0b drill pin
refuse_exit = 0

[log]
# -> compose logging.options for every service
max_size = "10m"
max_file = 3

[secrets]
# Keys `compose/.env` may contain. Values live in .env only; the names live here so
# `gfti doctor` can reject a non-secret that drifted into the secrets file.
# Both are required: compose interpolates both with `${VAR:?}` and has no default
# for either, because a defaulted credential in a public file is a leak, not a
# convenience. compose/.env.example carries dev placeholders; nothing else may.
required = ["POSTGRES_PASSWORD", "LEDGER_SECRET_OWNER"]
optional = []
