name: gfti

# W0a foundation stack (FULL-SYSTEM-BLUEPRINT §2.2) + the runtime profile (A2 §4 A-2).
#
# Configuration (A2 §4 A-4): every non-secret value below is `${VAR:?}` — required,
# with no `:-` fallback. A fallback *is* a second source of truth, and the whole point
# of `configs/gfti.toml` is that one file decides. `gfti` renders that file into the
# environment of every `docker compose` call it makes, so `gfti up`, `install.sh` and
# the gates cannot start different stacks. Secrets live in compose/.env only.
#
# Profiles:
#   (default)  the three stores: postgres · questdb · nats
#   runtime    the three hot-path services: rail · cell · e7 (A-1 contract: they
#              are resident processes, they heartbeat, and they exit 0 on SIGTERM)

# Shared shape for the three hot-path services. One image, one build (see
# runtime.Dockerfile), one restart policy, one healthcheck idiom.
x-runtime-service: &runtime-service
  profiles: ["runtime"]
  image: gfti-runtime:local
  build:
    context: ..
    dockerfile: compose/runtime.Dockerfile
  # A service that dies must come back without a human. This is the whole point of
  # A-1: before it, every service exited as soon as its fixture input ran out, so
  # "restart" would have been a crash loop.
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
    questdb:
      condition: service_healthy
  environment:
    # service-to-service names inside the compose network, never 127.0.0.1
    LEDGER_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?set in .env (dev local, see .env.example)}@postgres:5432/${POSTGRES_DB:?}
    RAIL_NATS_URL: ${NATS_URL:?}
    # The owner signing secret. Required with no default ON PURPOSE: a fallback
    # here would put a usable credential in a public file (AGENTS.md §4).
    # Development values come from compose/.env, production from an owner-side
    # secret store (A0 §5).
    LEDGER_SECRET_OWNER: ${LEDGER_SECRET_OWNER:?set in .env (dev local, see .env.example)}
    HEARTBEAT_MS: ${HEARTBEAT_MS:?}
  healthcheck:
    # "the beat is fresh", not "the pid exists" — see runtime.Dockerfile
    test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y \"$$HEARTBEAT_FILE\") )) -le 5"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:?}
      max-file: ${LOG_MAX_FILE:?}
  # A2 §4 item 7 asks for per-service CPU pinning. Deliberately NOT hardcoded here:
  # Docker rejects a cpuset naming a core the host does not have, so a default of
  # `0-1` would make the stack fail to start on a 2-core laptop — the portability
  # A0 §2 requires. Pin with an owner override file (`cpuset: "2-3"`) on hosts that
  # have the cores to spare; see docs/gates/RESIDENCY.md §6.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (dev local, see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 3s
      retries: 12

  questdb:
    image: questdb/questdb:7.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QUESTDB_HTTP_PORT:?}:9000"   # REST/ILP HTTP
      - "127.0.0.1:${QUESTDB_ILP_PORT:?}:9009"   # ILP TCP
    volumes:
      - qdbdata:/var/lib/questdb
    healthcheck:
      # readiness over REST TCP: the image is Debian-based with bash but no
      # curl/wget (verified in-container); /dev/tcp needs bash — fine here.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--name", "gfti-nats", "-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:?}:4222"   # client
      - "127.0.0.1:${NATS_MONITOR_PORT:?}:8222"   # monitor
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 wget -qO- http://127.0.0.1:8222/healthz?js_enabled_only=true || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  rail:
    <<: *runtime-service
    entrypoint: ["/usr/local/bin/rail"]
    # Rail's input is stdin (A2 §3.1 P1). `stdin_open` keeps that descriptor OPEN
    # with no writer: the reader thread blocks, the main loop idles and beats, and
    # the container is healthy-but-idle instead of crash-looping on an instant EOF.
    # A-10 replaces stdin with a socket/queue ingest; until then this is an honest
    # "up and waiting for a producer", not a working feed.
    stdin_open: true
    environment:
      LEDGER_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      RAIL_NATS_URL: ${NATS_URL:?}
      LEDGER_SECRET_OWNER: ${LEDGER_SECRET_OWNER:?set in .env (dev local, see .env.example)}
      HEARTBEAT_MS: ${HEARTBEAT_MS:?}
      HEARTBEAT_FILE: /run/gfti/hb/rail.json
      RAIL_TICK_MS: ${RAIL_TICK_MS:?}
      # Publisher side of `[subjects].market`: one value in the config feeds the
      # publisher here and the subscriber below (CELL_SUBJECT), so they cannot drift.
      MARKET_PREFIX: ${MARKET_PREFIX:?}
      # A-9: the D1 sink. Present here and absent in every gate's native run, which
      # is the difference between a live ingest and a measurement.
      RAIL_D1_URL: ${RAIL_D1_URL:?}

  cell:
    <<: *runtime-service
    entrypoint: ["/usr/local/bin/cell"]
    environment:
      LEDGER_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      RAIL_NATS_URL: ${NATS_URL:?}
      LEDGER_SECRET_OWNER: ${LEDGER_SECRET_OWNER:?set in .env (dev local, see .env.example)}
      HEARTBEAT_MS: ${HEARTBEAT_MS:?}
      HEARTBEAT_FILE: /run/gfti/hb/cell.json
      # 0 = unbounded (A-1). Anything else keeps the bounded gate semantics.
      CELL_TICKS: ${CELL_TICKS:?}
      CELL_SUBJECT: ${CELL_SUBJECT:?}
      MARKET_PREFIX: ${MARKET_PREFIX:?}
      # One value, two services: CELL_INTENT_PREFIX and E7_SUBJECT both derive from
      # configs/gfti.toml [subjects].intent, so a publisher and its subscriber
      # cannot drift apart (A2 item 15).
      CELL_INTENT_PREFIX: ${CELL_INTENT_PREFIX:?}
      # A-8 item 28: the cell's own signal/verdict/seat namespaces. Declared streams
      # in configs/gfti.toml [d2] capture them; a name published with no stream is
      # a message nobody stores, which `d2_gates.py` STREAMS checks.
      CELL_SIGNAL_PREFIX: ${CELL_SIGNAL_PREFIX:?}
      CELL_RISK_PREFIX: ${CELL_RISK_PREFIX:?}
      CELL_SEAT_PREFIX: ${CELL_SEAT_PREFIX:?}
      CELL_DECIDE_EVERY: ${CELL_DECIDE_EVERY:?}
      CELL_MAX_QTY: ${CELL_MAX_QTY:?}
      KILL_REFRESH_MS: ${KILL_REFRESH_MS:?}

  e7:
    <<: *runtime-service
    entrypoint: ["/usr/local/bin/e7"]
    environment:
      LEDGER_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      RAIL_NATS_URL: ${NATS_URL:?}
      LEDGER_SECRET_OWNER: ${LEDGER_SECRET_OWNER:?set in .env (dev local, see .env.example)}
      HEARTBEAT_MS: ${HEARTBEAT_MS:?}
      HEARTBEAT_FILE: /run/gfti/hb/e7.json
      E7_SUBJECT: ${E7_SUBJECT:?}
      E7_LEDGER_PREFIX: ${E7_LEDGER_PREFIX:?}
      E7_EXPECT: ${E7_EXPECT:?}
      # a resident ledger cell refuses and continues; exiting 7 is the W0b drill pin
      E7_REFUSE_EXIT: ${E7_REFUSE_EXIT:?}

volumes:
  pgdata:
  qdbdata:
